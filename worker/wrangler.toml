name = "keranjang-pintar-demo"
main = "src/index.js"
compatibility_date = "2026-07-01"

[vars]
ALLOWED_ORIGINS = "https://kannnnna9.github.io,http://localhost:8000,http://127.0.0.1:8000"
GEMINI_MODEL = "gemini-3.1-flash-lite"
DEVICE_DAILY_LIMIT = "50"
IP_DAILY_LIMIT = "150"
DEVICE_COOLDOWN_SECONDS = "5"

[[d1_databases]]
binding = "DB"
database_name = "keranjang_pintar_demo"
database_id = "replace-after-d1-create"
